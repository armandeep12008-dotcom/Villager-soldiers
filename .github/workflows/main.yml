name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build the jar
        run: gradle build --no-daemon

      - name: Save the jar so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: villager-soldiers-jar
          path: build/libs/*.jar
